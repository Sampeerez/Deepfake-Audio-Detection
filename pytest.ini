[pytest]
# Test discovery is rooted at tests/; -ra prints a short summary of skips/xfails
# so optional-dependency skips (e.g. transformers) are always visible in the log.
testpaths = tests
python_files = test_*.py
python_functions = test_*
# -m "not e2e": the browser tests need Playwright + a live server and take
# minutes, so the default run stays fast; an explicit `pytest -m e2e` comes
# after addopts and overrides the expression.
addopts = -ra --strict-markers -m "not e2e"
markers =
    e2e: browser end-to-end tests (Playwright + a live Streamlit server); slow.
         Run with:  pytest -m e2e   (skipped automatically if Playwright is absent)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
