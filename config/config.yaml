# =============================================================================
# GLOBAL CONFIGURATION FOR THE ANTI-SPOOFING TEST BENCH (TFG)
# =============================================================================
# This file centralises the PHYSICAL signal parameters and the dataset paths.
# The code never hardcodes "magic numbers": every module (features, data_loader,
# etc.) reads from here, guaranteeing experimental reproducibility.
#
# NOTE ON THE ADC (Analog-to-Digital Conversion):
#   ASVspoof 2019 LA is distributed at 16 kHz / 16 bits (PCM). This implies:
#   - Nyquist frequency = sample_rate / 2 = 8000 Hz. Any analog component above
#     it was removed with anti-aliasing low-pass filters before sampling to
#     avoid spectral folding (aliasing).
#   - 16-bit depth -> 65536 quantisation levels: wider dynamic range and smaller
#     approximation error than 8 bits.
# =============================================================================

audio:
  sample_rate: 16000        # Sample rate (Hz). Nyquist = 8000 Hz.
  n_fft: 1024               # FFT frame size. Exact power of 2 so the FFT runs in
                            # O(N log2 N) instead of the O(N^2) of the direct DFT.
  hop_length: 512           # Hop between frames (50% overlap). Compensates for the
                            # signal attenuated at the edges by the Hann window by
                            # overlapping consecutive frames.
  n_mels: 80                # Number of Mel filter-bank bands (MFCC).
  n_mfcc: 20                # Number of Mel cepstral coefficients to keep.
  n_lfcc: 20                # Number of linear cepstral coefficients (LFCC).
  n_linear_filters: 40      # Number of linear triangular filters before the DCT
                            # in the LFCC analytic pipeline.
  wavelet_mother: "db4"     # Mother wavelet (Daubechies-4) for the DWT.

# Fixed dimensions of the spectral "image" fed to the 2D CNN. The convolutional
# network requires constant-size tensors per batch.
cnn_input:
  freq_bins: 128            # Frequency bands after block compression.
  time_frames: 300          # Temporal frames (strict padding/truncation).
                            # 300 frames * 512 hop / 16000 Hz ~= 9.6 seconds.

dataset:
  path_la2019: "./data/ASVspoof2019/LA/LA"   # LA (Logical Access) corpus root.
  protocols_dir: "ASVspoof2019_LA_cm_protocols"
  protocols:
    train: "ASVspoof2019.LA.cm.train.trn.txt"
    dev: "ASVspoof2019.LA.cm.dev.trl.txt"
    eval: "ASVspoof2019.LA.cm.eval.trl.txt"

train_params:
  epochs: 20                # Full passes over the training subset.
  batch_size: 32            # Batch size for gradient descent.
  lr: 0.001                 # Learning rate of the Adam optimiser.
  dropout: 0.3              # Neuron drop probability (overfitting guard).
  num_workers: 2            # Parallel audio-loading processes in PyTorch.
  seed: 42                  # Global reproducibility seed.
  early_stopping_patience: 5  # Epochs without val-loss improvement before stopping.

# Per-architecture OPTIMAL configuration for "Full Comparison": each model trains
# with its best hyperparameters (these override train_params in the mass sweep).
# Architecture keys: cnn, cnn_se, resnet, resnext, crnn.
cnn_arch_params:
  cnn:                      # 5-Block CNN (fast baseline).
    epochs: 25
    batch_size: 32
    lr: 0.001
    early_stopping_patience: 5
  cnn_se:                   # 5-Block CNN + Squeeze-and-Excitation.
    epochs: 30
    batch_size: 32
    lr: 0.001
    early_stopping_patience: 6
  resnet:                   # ResNet + SE (residual, generalises better).
    epochs: 35
    batch_size: 32
    lr: 0.0005
    early_stopping_patience: 7
  resnext:                  # ResNeXt + SE (grouped convolution, cardinality).
    epochs: 35
    batch_size: 32
    lr: 0.0005
    early_stopping_patience: 7
  crnn:                     # CRNN (CNN + bidirectional GRU, temporal axis).
    epochs: 30
    batch_size: 16
    lr: 0.0005
    early_stopping_patience: 6

# Rigour of the CNN sweep in "Full Comparison":
#   - seeds: each architecture is trained ONCE PER SEED and the metrics are
#     averaged (mean +/- std). A single run on a saturated dev set can't tell the
#     architectures apart; repeating over seeds makes the ranking reliable. The
#     checkpoint saved to /models is the BEST seed (lowest unseen-attack val loss).
#   - holdout_attacks: attacks removed from training and used ONLY for early
#     stopping / model selection. train/dev share attacks (A01-A06), so validating
#     on "unseen" A05/A06 gives a real generalisation signal without touching eval
#     (A07-A19 / 2021). Empty list => dev is used as before.
#   - bonafide_val_frac: fraction of bonafide that accompanies the held-out
#     attacks in the validation set (bonafide has no attack to remove).
cnn_multiseed:
  seeds: [42, 43, 44]
  holdout_attacks: ["A05", "A06"]
  bonafide_val_frac: 0.1

experiment:
  use_cache: true           # On-disk cache of DSP vectors (cache/ directory).
  n_workers_dsp: 4          # Threads for parallel DSP extraction (1 = sequential).

# ASVspoof 2021, eval split only (no official train/dev).
# The LA track has real telephone-channel conditions.
# The DF track includes "in the wild" deepfakes (3 partitions).
dataset_2021:
  la:
    eval_dir: "./data/ASVspoof2021/ASVspoof2021_LA_eval/ASVspoof2021_LA_eval"
    keys:     "./data/ASVspoof2021/LA-keys-full/keys/LA/CM/trial_metadata.txt"
  df:
    eval_dirs:
      - "./data/ASVspoof2021/ASVspoof2021_DF_eval_part00/ASVspoof2021_DF_eval"
      - "./data/ASVspoof2021/ASVspoof2021_DF_eval_part01/ASVspoof2021_DF_eval"
      - "./data/ASVspoof2021/ASVspoof2021_DF_eval_part02/ASVspoof2021_DF_eval"
    keys:     "./data/ASVspoof2021/DF-keys-full/keys/DF/CM/trial_metadata.txt"
